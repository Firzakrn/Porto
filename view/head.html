<style>
  /* 1. Pastikan pembungkus luar <a> transparan (hilangkan kotak hijau) */
  #header-placeholder a.pull-cord,
  #header-placeholder a.pull-cord.active {
    background: transparent !important;
    background-color: transparent !important;
    box-shadow: none !important;
    transform: none !important;
  }

  /* 2. Panjang tali gantung */
  #header-placeholder a.pull-cord .cord-line {
    height: 28px !important;
  }
  #header-placeholder a.pull-cord:hover .cord-line {
    height: 55px !important;
  }
  #header-placeholder a.pull-cord.active .cord-line {
    height: 115px !important;
  }
  #header-placeholder a.pull-cord.active:hover .cord-line {
    height: 128px !important;
  }

  /* 3. Tampilan tombol saat TIDAK aktif */
  #header-placeholder a.pull-cord:not(.active) .intro-pill,
  #header-placeholder a.pull-cord:not(.active) .nav-pill-white {
    width: 195px !important;
    background: #ffffff !important;
    justify-content: center !important;
    padding: 0 16px !important;
  }
  #header-placeholder a.pull-cord:not(.active) .retro-tape,
  #header-placeholder a.pull-cord:not(.active) .pill-dots {
    display: none !important;
  }

  /* 4. Tampilan tombol saat AKTIF (lebar, selotip, 3 lingkaran berwarna) */
  #header-placeholder a.pull-cord.active .intro-pill,
  #header-placeholder a.pull-cord.active .nav-pill-white {
    width: 300px !important;
    justify-content: flex-start !important;
    gap: 12px !important;
    padding: 0 16px !important;
    position: relative !important;
  }

  /* Warna latar tombol aktif tiap halaman */
  #header-placeholder a.pull-cord.active.nav-intro .intro-pill,
  #header-placeholder a.pull-cord.active.nav-intro .nav-pill-white {
    background: #ffcf33 !important; /* Kuning Retro untuk Introduction */
  }
  #header-placeholder a.pull-cord.active.nav-proj .intro-pill,
  #header-placeholder a.pull-cord.active.nav-proj .nav-pill-white {
    background: #7cc6e8 !important; /* Biru Langit untuk Project */
  }
  #header-placeholder a.pull-cord.active.nav-cont .intro-pill,
  #header-placeholder a.pull-cord.active.nav-cont .nav-pill-white {
    background: #76dd77 !important; /* Hijau Mint untuk Contact */
  }

  /* Selotip miring */
  #header-placeholder .retro-tape {
    position: absolute;
    left: -10px;
    top: -12px;
    width: 38px;
    height: 16px;
    background: rgba(255, 148, 120, 0.92);
    border: 1.5px solid #000;
    transform: rotate(-22deg);
  }

  /* 3 Lingkaran Hiasan Berwarna (Merah Koral, Putih/Kuning, Biru/Hijau) */
  #header-placeholder .pill-dots {
    display: flex !important;
    gap: 6px;
  }
  #header-placeholder .pill-dots i {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.8px solid #000;
    display: inline-block;
  }
  #header-placeholder .pill-dots i:nth-child(1) {
    background: #ff6b6b !important; /* Lingkaran 1: Merah Koral */
  }
  #header-placeholder .pill-dots i:nth-child(2) {
    background: #ffffff !important; /* Lingkaran 2: Putih Bersih */
  }
  #header-placeholder .pill-dots i:nth-child(3) {
    background: #7cc6e8 !important; /* Lingkaran 3: Biru Cerah */
  }

  /* ============ Penyeimbang Jarak Horizontal 3 Tombol Navbar (Kanvas 1360px) ============ */

  /* 1. Posisi Dasar Simetris (Saat 1 tombol aktif atau default) */
  #header-placeholder a.pull-cord:nth-of-type(1) {
    left: 255px !important; /* INTRODUCTION */
  }
  #header-placeholder a.pull-cord:nth-of-type(2) {
    left: 615px !important; /* PROJECT */
  }
  #header-placeholder a.pull-cord:nth-of-type(3) {
    left: 935px !important; /* CONTACT */
  }

  /* 2. Penyesuaian Otomatis Saat INTRODUCTION Aktif (Melebar 300px ke kanan) */
  #header-placeholder a.pull-cord:nth-of-type(1).active {
    left: 215px !important;
  }
  #header-placeholder
    a.pull-cord:nth-of-type(1).active
    ~ a.pull-cord:nth-of-type(2) {
    left: 635px !important;
  }
  #header-placeholder
    a.pull-cord:nth-of-type(1).active
    ~ a.pull-cord:nth-of-type(3) {
    left: 945px !important;
  }

  /* 3. Penyesuaian Otomatis Saat PROJECT Aktif (Melebar 300px di tengah) */
  #header-placeholder a.pull-cord:nth-of-type(2).active {
    left: 555px !important;
  }
  #header-placeholder
    a.pull-cord:nth-of-type(2).active
    ~ a.pull-cord:nth-of-type(3) {
    left: 965px !important;
  }

  /* 4. Penyesuaian Otomatis Saat CONTACT Aktif (Melebar 300px di kanan) */
  #header-placeholder a.pull-cord:nth-of-type(3).active {
    left: 880px !important;
  }
</style>

<script>
  (function () {
    const path = window.location.pathname;
    const currentPage = path.split("/").pop() || "index.html";
    const links = document.querySelectorAll("#header-placeholder a.pull-cord");

    links.forEach((link) => {
      link.classList.remove("active", "nav-intro", "nav-proj", "nav-cont");
      const hrefPage = (link.getAttribute("href") || "").split("/").pop();

      const isIntroPage =
        (currentPage === "index.html" ||
          currentPage === "" ||
          currentPage === "porto.html") &&
        (hrefPage === "porto.html" || hrefPage === "index.html");

      if (isIntroPage || hrefPage === currentPage) {
        link.classList.add("active");
        if (hrefPage.includes("porto") || hrefPage.includes("index"))
          link.classList.add("nav-intro");
        else if (hrefPage.includes("project")) link.classList.add("nav-proj");
        else if (hrefPage.includes("contact")) link.classList.add("nav-cont");

        const pill = link.querySelector(".intro-pill, .nav-pill-white");
        if (pill) {
          if (!pill.querySelector(".retro-tape")) {
            const tape = document.createElement("span");
            tape.className = "retro-tape";
            pill.prepend(tape);
          }
          if (!pill.querySelector(".pill-dots")) {
            const dots = document.createElement("span");
            dots.className = "pill-dots";
            dots.innerHTML = "<i></i><i></i><i></i>";
            pill.insertBefore(dots, pill.children[1] || null);
          }
        }
      }
    });
  })();
</script>
