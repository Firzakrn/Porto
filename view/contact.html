    <script>
      fetch("head.html")
        .then((res) => res.text())
        .then((html) => {
          const box = document.getElementById("header-placeholder");
          box.innerHTML = html;
          // Jalankan script di dalam head.html
          box.querySelectorAll("script").forEach((s) => eval(s.innerText));
        });

      const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const now = new Date();
      document.getElementById("today-date").textContent =
        `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

      const storageKey = "contact-form-data";
      const formFields = [
        { id: "contact-name", key: "name" },
        { id: "contact-email", key: "email" },
        { id: "contact-topic", key: "topic" },
        { id: "contact-message", key: "message" },
      ];

      function loadSavedData() {
        const saved = localStorage.getItem(storageKey);
        if (!saved) return;

        try {
          const data = JSON.parse(saved);
          formFields.forEach(({ id, key }) => {
            const element = document.getElementById(id);
            if (element && data[key] !== undefined) {
              element.value = data[key];
            }
          });
        } catch (error) {
          console.error("Failed to load saved contact data", error);
        }
      }

      function saveFormData() {
        const data = {};
        formFields.forEach(({ id, key }) => {
          const element = document.getElementById(id);
          if (element) {
            data[key] = element.value;
          }
        });
        localStorage.setItem(storageKey, JSON.stringify(data));
      }

      formFields.forEach(({ id }) => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener("input", saveFormData);
          element.addEventListener("change", saveFormData);
        }
      });

      document.getElementById("send-button").addEventListener("click", () => {
        saveFormData();

        const name = document.getElementById("contact-name").value.trim();
        const email = document.getElementById("contact-email").value.trim();
        const topic = document.getElementById("contact-topic").value;
        const message = document.getElementById("contact-message").value.trim();

        const body = [
          `Name: ${name || "-"}`,
          `Email: ${email || "-"}`,
          `Topic: ${topic || "-"}`,
          "",
          message || "-",
        ].join("\n");

        const subject = `New contact from ${name || "website"}`;
        const encodedSubject = encodeURIComponent(subject);
        const encodedBody = encodeURIComponent(body);
        const mailtoLink = `mailto:firzakarin2206@gmail.com?subject=${encodedSubject}&body=${encodedBody}`;
        const gmailLink = `https://mail.google.com/mail/?view=cm&fs=1&to=firzakarin2206@gmail.com&su=${encodedSubject}&body=${encodedBody}`;

        const link = document.createElement("a");
        link.href = mailtoLink;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        setTimeout(() => {
          window.open(gmailLink, "_blank");
        }, 300);
      });

      loadSavedData();
    </script>
