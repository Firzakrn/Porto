      let currentIndex = 0;

      const leftWrap = document.getElementById("card-left-wrap");
      const rightWrap = document.getElementById("card-right-wrap");

      leftWrap.addEventListener("click", (e) => {
        e.stopPropagation();
        rightWrap.classList.remove("is-front-navbar");
        leftWrap.classList.toggle("is-front");
      });

      rightWrap.addEventListener("click", (e) => {
        e.stopPropagation();
        leftWrap.classList.remove("is-front");
        rightWrap.classList.toggle("is-front-navbar");
      });

      document.addEventListener("click", () => {
        leftWrap.classList.remove("is-front");
        rightWrap.classList.remove("is-front-navbar");
      });

      function openLightbox(src, caption) {
        document.getElementById("lightbox-img").src = src;
        document.getElementById("lightbox-caption").textContent = caption;
        document.getElementById("doc-lightbox").classList.add("open");
      }

      // Animasi slider jatuh dari atas ke bawah pada kedua struk
      function triggerDropSlide() {
        leftWrap.classList.remove("anim-drop-slide");
        rightWrap.classList.remove("anim-drop-slide");
        void leftWrap.offsetWidth;
        void rightWrap.offsetWidth;
        leftWrap.classList.add("anim-drop-slide");
        rightWrap.classList.add("anim-drop-slide");
      }

      function renderProject(idx) {
        const p = PROJECTS[idx];
        triggerDropSlide();

        document.getElementById("proj-code").textContent = p.code;
        document.getElementById("proj-stack").textContent = p.stack;
        document.getElementById("proj-promo-img").src = p.promoImg;
        document.getElementById("proj-title").textContent = p.title;
        document.getElementById("proj-desc").textContent = p.desc;

        const extraLinkEl = document.getElementById("proj-extra-link");
        if (p.extraLinkLabel) {
          extraLinkEl.innerHTML = `<a href="${p.extraLinkUrl}" target="_blank" onclick="event.stopPropagation()" class="font-mono font-black text-xs underline text-black hover:text-[#d9483b]">${p.extraLinkLabel}</a>`;
        } else {
          extraLinkEl.innerHTML = "";
        }

        const badgesEl = document.getElementById("proj-badges");
        let badgesHtml = `
          <span class="font-mono font-bold text-xs px-2.5 py-0.5 bg-[#f6dd43] border-2 border-black rounded-full">${p.date}</span>
          <span class="font-mono font-bold text-xs px-2.5 py-0.5 bg-[#89c4d6] border-2 border-black rounded-full">${p.type}</span>
        `;
        if (p.isRealClient) {
          badgesHtml += `
            <span class="font-mono font-black text-xs px-2.5 py-0.5 bg-[#ff7657] text-black border-2 border-black rounded-full shadow-[2px_2px_0px_#000]">
              ★ REAL CLIENT
            </span>
          `;
        }
        if (p.contributorCount) {
          badgesHtml += `
            <span class="font-mono font-bold text-xs px-2.5 py-0.5 bg-white border-2 border-black rounded-full">
              <i class="fas fa-users mr-1"></i>${p.contributorCount} Contributor${p.contributorCount > 1 ? "s" : ""}
            </span>
          `;
        }
        badgesEl.innerHTML = badgesHtml;

        const headerEl = document.getElementById("proj-contrib-header");
        const bodyEl = document.getElementById("proj-contributors");

        if (p.isFinalProject || !p.contributors) {
          headerEl.innerHTML = `<span>My Contribution</span>`;
          bodyEl.innerHTML = `<p class="leading-snug">${p.myContribution}</p>`;
        } else {
          headerEl.innerHTML = `
            <span>Contributor</span>
            <span class="px-2 py-0.5 bg-[#bce5ed] border border-black rounded">${p.contributors.length} Orang</span>
          `;
          bodyEl.innerHTML = p.contributors
            .map((c) => {
              const nameTag = c.url
                ? `<a href="${c.url}" target="_blank" onclick="event.stopPropagation()" class="underline font-black text-[#1d4ed8] hover:text-black" title="Buka GitHub ${c.name}">${c.name}</a>`
                : `<strong class="font-black">${c.name}</strong>`;
              return `<div>${nameTag} = <span>${c.role}</span></div>`;
            })
            .join("");
        }

        // 3 Prangko Dokumentasi (Klik untuk Lightbox, Tanpa Hover)
        document.getElementById("proj-doc-stamps").innerHTML = p.docs
          .slice(0, 3)
          .map((imgSrc, i) => {
            if (imgSrc) {
              return `
                <div class="doc-stamp-item" onclick="event.stopPropagation(); openLightbox('${imgSrc}', '${p.title} — Dokumentasi #0${i + 1}')">
                  <div class="doc-stamp-inner">
                    <img src="${imgSrc}" alt="Doc ${i + 1}" />
                    <span class="absolute bottom-0.5 right-1 bg-[#ffcf33] border border-black px-1 font-mono font-black text-[8px]">
                      DOC 0${i + 1}
                    </span>
                  </div>
                </div>
              `;
            }
            return `
              <div class="doc-stamp-item is-silhouette" onclick="event.stopPropagation()" title="Belum ada foto dokumentasi">
                <div class="doc-stamp-inner">
                  <svg width="16" height="14" viewBox="0 0 24 20" fill="none" stroke="#666" stroke-width="1.8">
                    <rect x="2" y="2" width="20" height="16" rx="2" stroke-dasharray="3 2" />
                    <circle cx="8" cy="7" r="2" />
                    <path d="M3 16 L9 10 L13 14 L16 11 L21 16" />
                  </svg>
                  <span class="font-mono font-bold text-[8px]">STAMP #0${i + 1}</span>
                </div>
              </div>
            `;
          })
          .join("");

        const btn = document.getElementById("proj-action-btn");
        btn.textContent = p.btnLabel;
        btn.href = p.btnUrl;
        if (p.isContactTrigger) {
          btn.removeAttribute("target");
          btn.onclick = (e) => {
            e.stopPropagation();
            localStorage.setItem(
              "contact-form-data",
              JSON.stringify({
                name: "",
                email: "",
                topic: "Comment",
                message: p.contactMsg,
              }),
            );
          };
        } else {
          btn.setAttribute("target", "_blank");
          btn.onclick = (e) => e.stopPropagation();
        }

        document.getElementById("proj-dots").innerHTML = PROJECTS.map(
          (item, i) => `
            <div class="dot-nav-item">
              <button
                type="button"
                onclick="event.stopPropagation(); goToProject(${i})"
                class="w-3.5 h-3.5 rounded-full border-2 border-black cursor-pointer transition-transform hover:scale-125 ${
                  i === idx ? "bg-[#ff6b6b] scale-110" : "bg-white"
                }"
              ></button>

              <!-- Chrome Tab Preview Card saat Hover -->
              <div class="chrome-tab-preview">
                <div class="chrome-tab-bar">
                  <span class="chrome-tab-dots"><i></i><i></i><i></i></span>
                  <span>0${i + 1} • ${item.date}</span>
                </div>
                <img src="${item.promoImg}" alt="${item.title}" class="chrome-tab-thumb" />
                <div class="chrome-tab-info">
                  <div class="font-black text-[11px] leading-tight text-black truncate">
                    ${item.title}
                  </div>
                  <div class="text-[9.5px] text-gray-700 mt-0.5 truncate">
                    ${item.type}${item.isRealClient ? " • ★ Real Client" : ""}
                  </div>
                </div>
              </div>
            </div>
          `,
        ).join("");
      }

      function goToProject(i) {
        currentIndex = i;
        renderProject(currentIndex);
      }

      document.getElementById("btn-prev").addEventListener("click", (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex - 1 + PROJECTS.length) % PROJECTS.length;
        renderProject(currentIndex);
      });

      document.getElementById("btn-next").addEventListener("click", (e) => {
        e.stopPropagation();
        currentIndex = (currentIndex + 1) % PROJECTS.length;
        renderProject(currentIndex);
      });

      renderProject(0);

      fetch("head.html")
        .then((response) => response.text())
        .then((data) => {
          const box = document.getElementById("header-placeholder");
          box.innerHTML = data;
          box.querySelectorAll("script").forEach((s) => eval(s.innerText));
        });

      function triggerDropSlide() {
        const leftJagged = document.querySelector(".receipt-jagged-left");
        const rightJagged = document.querySelector(".receipt-jagged-right");
        leftJagged.classList.remove("anim-drop-slide");
        rightJagged.classList.remove("anim-drop-slide");
        void leftJagged.offsetWidth;
        void rightJagged.offsetWidth;
        leftJagged.classList.add("anim-drop-slide");
        rightJagged.classList.add("anim-drop-slide");
      }
    </script>
  </body>
</html>
